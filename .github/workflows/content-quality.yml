name: Content Quality

on:
  push:
    paths:
      - "server/prisma/content/**"
      - "server/prisma/schema.prisma"
      - "server/prisma.config.ts"
      - "server/package.json"
      - "server/package-lock.json"
      - "server/tsconfig.json"
      - ".github/workflows/content-quality.yml"

  pull_request:
    paths:
      - "server/prisma/content/**"
      - "server/prisma/schema.prisma"
      - "server/prisma.config.ts"
      - "server/package.json"
      - "server/package-lock.json"
      - "server/tsconfig.json"
      - ".github/workflows/content-quality.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content-quality:
    name: Validate Content Engine
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: content_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d content_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: server

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/content_ci
      CONTENT_SEED_VALIDATE: "true"
      CONTENT_SEED_VERBOSE: "false"
      ENABLE_VOCABULARY_ENRICHMENT: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check Content Engine
        run: npm run content:check

      - name: Prepare test database
        run: npm run content:database:prepare

      - name: Import content
        run: npm run content:import

      - name: Verify database content
        run: npm run content:verify

      - name: Show content statistics
        run: npm run content:stats
