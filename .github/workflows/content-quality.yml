name: Content Quality

on:
  push:
    paths:
      - 'server/prisma/content/**'
      - 'server/prisma/schema.prisma'
      - 'server/prisma.config.ts'
      - 'server/package.json'
      - 'server/package-lock.json'
      - 'server/tsconfig.json'
      - '.github/workflows/content-quality.yml'

  pull_request:
    paths:
      - 'server/prisma/content/**'
      - 'server/prisma/schema.prisma'
      - 'server/prisma.config.ts'
      - 'server/package.json'
      - 'server/package-lock.json'
      - 'server/tsconfig.json'
      - '.github/workflows/content-quality.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content-quality:
    name: Validate Content Engine
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/content_ci
      CONTENT_SEED_VALIDATE: 'true'
      CONTENT_SEED_VERBOSE: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check formatting
        run: |
          npx prettier --check \
            prisma/content \
            package.json

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run content tests
        run: npm run content:test

      - name: Run content audit
        run: npm run content:audit
