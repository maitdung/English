services:
  postgres:
    image: postgres:17-alpine
    container_name: mtd-lingo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mtd_lingo
      POSTGRES_USER: mtd_lingo
      POSTGRES_PASSWORD: mtd_lingo_dev_password
    ports:
      - "5432:5432"
    volumes:
      - mtd_lingo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtd_lingo -d mtd_lingo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mtd-lingo-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - mtd_lingo_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mtd_lingo_postgres_data:
  mtd_lingo_redis_data:
