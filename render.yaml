services:
  - type: web
    name: mtd-lingo-api
    env: node
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    autoDeploy: true
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: API_PREFIX
        value: api
      - key: ENABLE_SWAGGER_DOCS
        value: "false"
      - key: HEALTH_CHECK_REDIS_ENABLED
        value: "false"
