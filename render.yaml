services:
  - type: web
    name: mtd-lingo-api
    env: node
    branch: develop
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CLOUDFLARE_PAGES_DEPLOY_HOOK_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: API_PREFIX
        value: api
      - key: ENABLE_SWAGGER_DOCS
        value: "false"
      - key: HEALTH_CHECK_REDIS_ENABLED
        value: "false"
      - key: ENABLE_VOCABULARY_ENRICHMENT
        value: "false"
      - key: FRONTEND_URL
        value: https://english-c0h.pages.dev
